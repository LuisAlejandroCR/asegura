name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: action-setup reads packageManager from package.json,
      # so CI, Railway and local stay on one pnpm. Settings in pnpm-workspace.yaml need 10+.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx tsc --noEmit

      - run: pnpm run lint

      - run: pnpm run build

      - run: pnpm run test

      # apps/web used to be built only by Vercel, so a broken page reached production green.
      - name: Build AseguraWeb
        run: pnpm --filter asegura-web run build

      # Informational: 8 high advisories sit in runtime deps today (multer, lodash, js-yaml,
      # brace-expansion), none reachable from user input. Blocking on it would just be ignored.
      - name: Dependency audit (runtime only)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
