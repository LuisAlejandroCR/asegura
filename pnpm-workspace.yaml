packages:
  - 'apps/*'

allowBuilds:
  # false: we don't use LiveKit's local-inference (VAD/turn-detection) — cloud STT/LLM/TTS
  # only (Groq + ElevenLabs, see src/voice-agent/). No reason to run its native build script.
  '@livekit/local-inference': false
  '@nestjs/core': true
  esbuild: true

onlyBuiltDependencies:
  - '@nestjs/core'

# The local end-of-turn model is ~1 GB resident in BOTH the worker and its inference child,
# and this stack is cloud STT/LLM/TTS only. Skipping the platform binary makes the native
# binding unavailable, which the framework handles by disabling local EOT with a warning.
ignoredOptionalDependencies:
  - '@livekit/local-inference-*'
