<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Asegura — agente conversacional que identifica qué seguro necesitas y por qué, cotiza con razones explícitas y cierra la venta en menos de 3 minutos. Sin formularios, sin asesores.">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Asegura — Seguros automatizados</title>
<style>
  /* Two references merged: a fintech card-product hero clip ("Infinite" — not
     our asset; translated to a floating "policy card", now a REAL Three.js/WebGL
     render, not a CSS transform trick) and Dribbble's "Bubdle" insurance site
     (Halo Lab) for the stat-card row pattern below the headline. Kept the
     starlit-sky atmosphere from the prior round; navy/gold/white only. Card
     stats (11 productos, 5 aseguradoras, 3 min) are real figures from the
     product catalog — nothing fabricated. */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;overflow-x:hidden;background:#001233;color:#fff;
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ---- sky ---- */
  .sky{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:radial-gradient(ellipse 1300px 900px at 50% -12%,#0c3576 0%,#041a44 42%,#00081f 100%)}
  .stars{position:absolute;inset:0;width:100%;height:100%}
  .stars circle:nth-child(4n){animation:twinkle 4s ease-in-out infinite}
  .stars circle:nth-child(4n+1){animation:twinkle 5.5s ease-in-out .8s infinite}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
  .glow-warm{position:absolute;top:9%;right:13%;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle,#fff7d6 0%,rgba(255,215,0,.5) 55%,transparent 78%);
    box-shadow:0 0 50px 14px rgba(255,215,0,.22)}
  .cloud{position:absolute;border-radius:50%;filter:blur(55px);animation:drift ease-in-out infinite alternate}
  .cloud-1{width:520px;height:220px;background:rgba(255,255,255,.05);top:18%;left:-8%;animation-duration:38s}
  .cloud-2{width:420px;height:180px;background:rgba(255,255,255,.045);top:38%;right:-10%;animation-duration:46s}
  .cloud-3{width:380px;height:150px;background:rgba(120,160,255,.06);bottom:14%;left:15%;animation-duration:52s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(46px)}}
  .horizon{position:absolute;left:0;right:0;bottom:0;height:38%;
    background:linear-gradient(to top,rgba(255,190,70,.07),transparent)}

  @media(prefers-reduced-motion:reduce){.stars circle,.cloud{animation:none!important}}

  /* ---- nav ---- */
  nav{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:20px}
  @media(min-width:768px){nav{padding:26px 44px}}
  .brand{display:flex;align-items:center;gap:9px}
  .brand img{height:26px;width:auto}
  .brand-txt{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .nav-actions{display:flex;align-items:center;gap:10px}

  .btn{border-radius:999px;padding:11px 22px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background-color .2s ease,border-color .2s ease}
  .btn-solid{background:#fff;color:#00123a}
  .btn-solid:hover{background:#e9e9e9}
  .btn-gold{background:#FFD700;color:#001A4D}
  .btn-gold:hover{background:#ffe14d}
  .btn-glass{color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
  .btn-glass:hover{background:rgba(255,255,255,.15)}

  /* ---- stage: real WebGL policy card ---- */
  main{position:relative;z-index:10;min-height:100svh;display:flex;flex-direction:column}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:24px 20px;min-height:260px}
  .card-glow{position:absolute;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,0,.22),transparent 70%);filter:blur(30px)}
  .stage-3d{position:relative;width:min(84vw,420px);height:min(60vw,300px)}
  .stage-3d canvas{display:block;width:100%!important;height:100%!important}

  /* ---- copy ---- */
  .copy{position:relative;z-index:10;padding:0 20px 32px}
  @media(min-width:768px){.copy{padding:0 44px 52px}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.78);margin-bottom:16px}
  .eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:#FFD700}
  h1{font-weight:400;letter-spacing:-.03em;line-height:1.05;max-width:640px;
    font-size:clamp(1.9rem,5.4vw,3.4rem);margin-bottom:16px;text-shadow:0 3px 20px rgba(0,0,0,.35)}
  h1 .accent{color:#FFD700}
  .how{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.85);
    margin-bottom:30px;padding-bottom:2px;border-bottom:1px solid rgba(255,255,255,.3)}
  .how svg{background:#FFD700;color:#001A4D;border-radius:50%;padding:5px;flex-shrink:0}

  /* ---- Bubdle-style stat row ---- */
  .stats{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:700px){.stats{grid-template-columns:1.3fr 1fr 1fr}}
  .stat{border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:104px}
  .stat-gold{background:#FFD700;color:#001A4D}
  .stat-glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .stat-num{font-size:clamp(24px,3.2vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1}
  .stat-glass .stat-num{color:#FFD700}
  .stat-label{font-size:12.5px;margin-top:6px;line-height:1.4}
  .stat-gold .stat-label{color:rgba(0,18,58,.75)}
  .stat-glass .stat-label{color:rgba(255,255,255,.68)}
</style>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('card3d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0.25, 4.4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x9db6ff, 0.85));
    const fill = new THREE.DirectionalLight(0xffffff, 0.9);
    fill.position.set(0, 0.5, 6);
    scene.add(fill);
    const key = new THREE.DirectionalLight(0xfff2cc, 1.1);
    key.position.set(3, 4, 5);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x6fa8ff, 0.7);
    rim.position.set(-4, 1.5, -3);
    scene.add(rim);
    const goldLight = new THREE.PointLight(0xffd700, 2.4, 12, 2);
    goldLight.position.set(-1.6, 1.4, 2.4);
    scene.add(goldLight);

    // rounded-rect extrusion for the card body
    function roundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      s.moveTo(-w / 2 + r, -h / 2);
      s.lineTo(w / 2 - r, -h / 2);
      s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      s.lineTo(w / 2, h / 2 - r);
      s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      s.lineTo(-w / 2 + r, h / 2);
      s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      s.lineTo(-w / 2, -h / 2 + r);
      s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
      return s;
    }
    const geo = new THREE.ExtrudeGeometry(roundedRectShape(2.7, 1.7, 0.16), {
      depth: 0.1, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 4, curveSegments: 16,
    });
    geo.center();

    // canvas texture drawn for the card face — real product copy, no external asset
    function makeFaceTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 645;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 1024, 645);
      g.addColorStop(0, '#1c3f82'); g.addColorStop(1, '#050f2e');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 645);

      const sheen = ctx.createLinearGradient(0, 0, 1024, 645);
      sheen.addColorStop(0.28, 'rgba(255,255,255,0)');
      sheen.addColorStop(0.42, 'rgba(255,255,255,.14)');
      sheen.addColorStop(0.56, 'rgba(255,255,255,0)');
      ctx.fillStyle = sheen; ctx.fillRect(0, 0, 1024, 645);

      ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(88, 70); ctx.lineTo(48, 88); ctx.lineTo(48, 128);
      ctx.bezierCurveTo(48, 168, 66, 198, 88, 208);
      ctx.bezierCurveTo(110, 198, 128, 168, 128, 128);
      ctx.lineTo(128, 88); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(70, 138); ctx.lineTo(83, 152); ctx.lineTo(108, 118); ctx.stroke();

      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,255,255,.65)';
      ctx.font = '600 24px Inter, sans-serif';
      ctx.fillText('PÓLIZA DIGITAL', 968, 78);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#fff';
      ctx.font = '800 84px Inter, sans-serif';
      ctx.fillText('ASEGURA', 56, 540);
      ctx.fillStyle = 'rgba(255,215,0,.85)';
      ctx.font = '600 26px Inter, sans-serif';
      ctx.fillText('COBERTURA ACTIVA', 58, 580);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    const sideMat = new THREE.MeshStandardMaterial({ color: 0x0a1f4d, metalness: 0.35, roughness: 0.45 });
    const capMat = new THREE.MeshStandardMaterial({ color: 0x0c2050, metalness: 0.35, roughness: 0.45 });
    const body = new THREE.Mesh(geo, [sideMat, capMat]);

    // ExtrudeGeometry's auto-UVs on the cap face are unreliable for texture
    // placement, so the branded face is a separate flat ShapeGeometry
    // (correct, predictable 0-1 UVs) overlaid just in front of the cap.
    const faceW = 2.68, faceH = 1.68;
    const faceGeo = new THREE.ShapeGeometry(roundedRectShape(faceW, faceH, 0.155), 24);
    // ShapeGeometry's default UV generator uses raw shape-space vertex
    // coordinates (here roughly -1.34..1.34 / -0.84..0.84) directly as UVs,
    // not normalized 0-1 — almost the whole texture was clamping to one edge
    // pixel. Recompute UVs from actual vertex position instead.
    {
      const posAttr = faceGeo.attributes.position;
      const uv = faceGeo.attributes.uv;
      for (let i = 0; i < uv.count; i++) {
        uv.setXY(i, posAttr.getX(i) / faceW + 0.5, posAttr.getY(i) / faceH + 0.5);
      }
      uv.needsUpdate = true;
    }
    const faceMat = new THREE.MeshStandardMaterial({ map: makeFaceTexture(), metalness: 0.08, roughness: 0.55, side: THREE.DoubleSide });
    const face = new THREE.Mesh(faceGeo, faceMat);
    face.position.z = 0.095;

    const card = new THREE.Group();
    card.add(body, face);
    card.rotation.set(0.1, -0.35, 0);
    scene.add(card);

    function resize() {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    new ResizeObserver(resize).observe(container);

    const t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / 1000;
      card.rotation.y = -0.35 + Math.sin(t * 0.5) * 0.12;
      card.rotation.x = 0.1 + Math.sin(t * 0.35) * 0.03;
      card.position.y = Math.sin(t * 0.7) * 0.12;
      renderer.render(scene, camera);
      if (!reduceMotion) requestAnimationFrame(frame);
    }
    if (!reduceMotion) requestAnimationFrame(frame);
    else { renderer.render(scene, camera); }
  </script>

</body>
